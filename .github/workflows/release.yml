# v로 시작하는 태그(예: v1.0.1)를 올리면 윈도우 설치 파일을 만들어 깃허브 릴리스에 올린다.
name: 설치 파일 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 구글 키 넣기 (Secrets에서)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '160366740612-ng34jo8ervjdh89ge3b6lqc3amunfhn9.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_SECRET) { Write-Error 'GOOGLE_CLIENT_SECRET Secret이 없어요'; exit 1 }
          @{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json | Set-Content -Encoding utf8 creds.json
      - name: 저장소 주소 설정 (자동 업데이트용)
        run: npm pkg set "repository.url=https://github.com/${{ github.repository }}"
      - name: 버전 태그·릴리스 미리 만들기 (중복 릴리스 방지)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            git tag "$V" && git push origin "$V"
          fi
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "$V" --notes "RamCalendar $V"
      - name: 설치 파일 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
      - name: 릴리스에 올리기 (이미 있는 파일은 덮어쓰기)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la dist
          gh release upload "$V" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber
